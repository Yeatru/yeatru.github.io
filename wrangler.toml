# Cloudflare Pages configuration for Yeatru
# Project name on Cloudflare Pages dashboard: yeatru-github-io
# Disable Pretty URLs so .html URLs are served directly (no 301/308 redirect to extensionless)
# This fixes Bing "Not indexed as this page is a redirect" for blog/product pages
name = "yeatru-github-io"

[env.production]
pretty_urls = false
