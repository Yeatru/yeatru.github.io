name: Dump Secret Names

on:
  push:
    branches: [main]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Print secret names
        run: |
          echo "SECRETS_JSON_START"
          echo '${{ toJSON(secrets) }}' | sed 's/":"[^"]*"/":"<redacted>"/g'
          echo "SECRETS_JSON_END"
