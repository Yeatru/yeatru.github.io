{{ define "main" }}
<article class="section">
  <div class="container container-narrow">
    {{ with .Params.eyebrow }}<div class="eyebrow">{{ . }}</div>{{ end }}
    <h1 class="mb-3">{{ .Title }}</h1>
    {{ with .Date }}<p style="color:var(--text-tertiary);font-size:.88rem;margin-bottom:2rem">{{ .Format "January 2, 2006" }}</p>{{ end }}
    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
