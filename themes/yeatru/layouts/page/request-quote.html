{{ define "main" }}
<section class="section">
  <div class="container">
    <div class="text-center mb-4">
      <div class="eyebrow mx-auto" style="justify-content:center">Request a Quote</div>
      <h1>Get a free sourcing quote</h1>
      <p style="color:var(--text-secondary);max-width:600px;margin:1rem auto">Share your product details and we'll reply with a real quote within 24 hours. No commitment required.</p>
    </div>

    <div class="card" style="max-width:760px;margin:0 auto">
      <form action="https://formsubmit.co/info@yeatru.com" method="POST">
        <input type="hidden" name="_subject" value="New quote request from Yeatru website">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
          <div><label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:.3rem">Full Name *</label><input type="text" name="fullName" required style="width:100%;padding:.7rem;border:1px solid var(--border);border-radius:var(--r-sm)"></div>
          <div><label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:.3rem">Email *</label><input type="email" name="email" required style="width:100%;padding:.7rem;border:1px solid var(--border);border-radius:var(--r-sm)"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
          <div><label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:.3rem">Company</label><input type="text" name="company" style="width:100%;padding:.7rem;border:1px solid var(--border);border-radius:var(--r-sm)"></div>
          <div><label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:.3rem">Phone / WhatsApp</label><input type="tel" name="phone" style="width:100%;padding:.7rem;border:1px solid var(--border);border-radius:var(--r-sm)"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
          <div><label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:.3rem">Product Category *</label><input type="text" name="productCategory" required placeholder="e.g. Toys, Apparel, Electronics" style="width:100%;padding:.7rem;border:1px solid var(--border);border-radius:var(--r-sm)"></div>
          <div><label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:.3rem">Quantity *</label><input type="text" name="quantity" required placeholder="e.g. 500 units" style="width:100%;padding:.7rem;border:1px solid var(--border);border-radius:var(--r-sm)"></div>
        </div>
        <div style="margin-bottom:1rem"><label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:.3rem">Product Details *</label><textarea name="productDetails" rows="4" required placeholder="Describe your product: specs, materials, target price, links, photos..." style="width:100%;padding:.7rem;border:1px solid var(--border);border-radius:var(--r-sm);resize:vertical"></textarea></div>
        <div style="margin-bottom:1rem"><label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:.3rem">Stage</label><select name="productStage" style="width:100%;padding:.7rem;border:1px solid var(--border);border-radius:var(--r-sm)"><option>Just exploring</option><option>Ready to sample</option><option>Ready to order</option><option>Need OEM / private label</option></select></div>
        <div style="margin-bottom:1rem"><label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:.3rem">Additional Info</label><textarea name="additionalInfo" rows="3" placeholder="Anything else we should know..." style="width:100%;padding:.7rem;border:1px solid var(--border);border-radius:var(--r-sm);resize:vertical"></textarea></div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Submit Quote Request</button>
      </form>
    </div>
  </div>
</section>
{{ end }}
