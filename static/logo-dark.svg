<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" width="320" height="230">
  <!-- Yeatru brand logo (dark background version): orange network icon + white wordmark -->
  <defs>
    <linearGradient id="yeatruOrangeDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>

  <!-- ===== Network / supply-chain icon (top, centered) ===== -->
  <g transform="translate(0,0)">
    <g stroke="url(#yeatruOrangeDark)" stroke-width="2.2" stroke-linecap="round" opacity="0.9">
      <line x1="70"  y1="35" x2="110" y2="22"/>
      <line x1="110" y1="22" x2="155" y2="30"/>
      <line x1="155" y1="30" x2="200" y2="18"/>
      <line x1="200" y1="18" x2="245" y2="38"/>
      <line x1="70"  y1="35" x2="90"  y2="65"/>
      <line x1="110" y1="22" x2="135" y2="72"/>
      <line x1="155" y1="30" x2="135" y2="72"/>
      <line x1="155" y1="30" x2="185" y2="60"/>
      <line x1="200" y1="18" x2="225" y2="75"/>
      <line x1="245" y1="38" x2="225" y2="75"/>
      <line x1="90"  y1="65" x2="135" y2="72"/>
      <line x1="135" y1="72" x2="185" y2="60"/>
      <line x1="185" y1="60" x2="225" y2="75"/>
      <line x1="90"  y1="65" x2="110" y2="95"/>
      <line x1="135" y1="72" x2="160" y2="100"/>
      <line x1="185" y1="60" x2="205" y2="92"/>
      <line x1="225" y1="75" x2="245" y2="105"/>
      <line x1="110" y1="95" x2="160" y2="100"/>
      <line x1="160" y1="100" x2="205" y2="92"/>
      <line x1="205" y1="92" x2="245" y2="105"/>
    </g>

    <g fill="url(#yeatruOrangeDark)">
      <circle cx="70"  cy="35" r="7"/>
      <circle cx="110" cy="22" r="5"/>
      <circle cx="155" cy="30" r="11"/>
      <circle cx="200" cy="18" r="6"/>
      <circle cx="245" cy="38" r="7"/>
      <circle cx="90"  cy="65" r="6"/>
      <circle cx="135" cy="72" r="10"/>
      <circle cx="185" cy="60" r="5"/>
      <circle cx="225" cy="75" r="8"/>
      <circle cx="110" cy="95" r="5"/>
      <circle cx="160" cy="100" r="9"/>
      <circle cx="205" cy="92" r="6"/>
      <circle cx="245" cy="105" r="5"/>
    </g>

    <g transform="translate(155,30)" stroke="#FFFFFF" stroke-width="1.4" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="6"/>
      <line x1="-6" y1="0" x2="6" y2="0"/>
      <ellipse cx="0" cy="0" rx="6" ry="2.6"/>
      <line x1="0" y1="-6" x2="0" y2="6"/>
    </g>

    <g transform="translate(135,72)" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round">
      <circle cx="-1.5" cy="-1.5" r="5"/>
      <line x1="2" y1="2" x2="5.5" y2="5.5"/>
    </g>

    <g transform="translate(160,100)" fill="#FFFFFF">
      <rect x="-5" y="-3.5" width="10" height="7" rx="1"/>
      <line x1="-5" y1="-3.5" x2="5" y2="-3.5" stroke="#FF8C00" stroke-width="1"/>
      <line x1="0" y1="-3.5" x2="0" y2="3.5" stroke="#FF8C00" stroke-width="1"/>
    </g>
  </g>

  <!-- ===== Wordmark "Yeatru" (white for dark bg) ===== -->
  <text x="160" y="150" text-anchor="middle"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        font-weight="800" font-size="52" fill="#FFFFFF"
        letter-spacing="-1.5">Yeatru</text>

  <!-- ===== Tagline ===== -->
  <text x="160" y="180" text-anchor="middle"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        font-weight="500" font-size="15" fill="#CBD5E1"
        letter-spacing="0.3">Global Procurement. Inspection. Logistics.</text>
  <text x="160" y="204" text-anchor="middle"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        font-weight="600" font-size="15" fill="#FFB347"
        letter-spacing="0.3">One Stop, Seamless Service.</text>
</svg>
